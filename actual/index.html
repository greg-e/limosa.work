<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark">
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>Actual Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/actual/assets/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/assets/img/logo.png" alt="Actual logo">
        <span>Actual</span>
      </a>

      <!-- Mobile nav toggle -->
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <nav id="site-menu" class="site-nav" data-collapsible>
        <a href="/actual/">Deck</a>
        <a href="/pages/contact.html">Contact</a>
      </nav>

      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </header>

    <div class="actual-page">
      <div class="actual-container" style="padding-top: 1.25rem; padding-bottom: 0;">
        <p class="actual-card-body">
          The principles behind Actual. Tap a card to read why it matters and how we apply it.
        </p>
      </div>
    </div>

    <div
      id="root"
      data-cards-url="/assets/actual-deck/cards.json"
    ></div>
    <script>
      (() => {
        // Keep the deck's search bar pinned just below the sticky site header.
        const header = document.querySelector('.site-header');
        if (header) {
          const setHeaderHeight = () =>
            document.documentElement.style.setProperty('--site-header-h', header.offsetHeight + 'px');
          setHeaderHeight();
          if (window.ResizeObserver) new ResizeObserver(setHeaderHeight).observe(header);
        }

        const toggle = document.querySelector('.nav-toggle');
        const menu = document.getElementById('site-menu');
        if (!toggle || !menu) return;

        const setOpen = (isOpen) => {
          toggle.classList.toggle('is-open', isOpen);
          menu.classList.toggle('is-open', isOpen);
          toggle.setAttribute('aria-expanded', String(isOpen));
        };

        toggle.addEventListener('click', () => {
          const nextState = !menu.classList.contains('is-open');
          setOpen(nextState);
        });

        window.addEventListener('resize', () => {
          if (window.innerWidth > 900) {
            setOpen(false);
          }
        });

        document.addEventListener('click', (event) => {
          if (!menu.classList.contains('is-open')) return;
          if (menu.contains(event.target) || toggle.contains(event.target)) return;
          setOpen(false);
        });
      })();
    </script>
    <script type="module" src="/actual/assets/index.js"></script>
    <script src="/assets/js/theme.js"></script>
  </body>
</html>
