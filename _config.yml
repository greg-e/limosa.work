title: Actual
description: A research-stage idea. A passive badge records time on site as the worker's own verified timecard.
url: https://limosa.work
theme: minima
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Where the survey form POSTs. See worker/README.md.
survey_endpoint: "https://survey.limosa.work/responses"

# `exclude` replaces Jekyll's defaults, so the defaults are repeated here.
# `worker` is the survey backend and must not be published with the site.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - worker
